name: Branch Protection

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  enforce-pr-workflow:
    name: Enforce PR Workflow
    runs-on: ubuntu-latest
    steps:
      - name: Check if push is from merged PR
        if: github.event_name == 'push'
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          IS_FORCED: ${{ github.event.forced }}
        run: |
          # Block force pushes
          if [[ "$IS_FORCED" == "true" ]]; then
            echo "❌ Force pushes to main are not allowed!"
            echo "Force push detected by: $ACTOR"
            exit 1
          fi

          # Allow bots
          if [[ "$ACTOR" == "github-actions[bot]" ]] || \
             [[ "$ACTOR" == "dependabot[bot]" ]]; then
            echo "✅ Automated bot push allowed"
            exit 0
          fi

          # Allow merge commits (Merge pull request #N) and squash commits (ends with (#N))
          if [[ ! "$COMMIT_MSG" =~ ^Merge\ pull\ request\ #[0-9]+ ]] && \
             [[ ! "$COMMIT_MSG" =~ \(#[0-9]+\)$ ]]; then
            echo "❌ Direct pushes to main are not allowed!"
            echo "Please create a pull request instead."
            echo "Actor: $ACTOR"
            exit 1
          fi


  require-approval:
    name: Require PR Approval
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check for approvals
        uses: actions/github-script@v7
        with:
          script: |
            const author = context.payload.pull_request.user.login;
            const orgOwners = ['dalestubblefield', 'gapietro', 'michaelbuckner'];

            // Org owners can self-merge without separate approval
            if (orgOwners.includes(author)) {
              console.log('✅ Org owner PR — no separate approval required: ' + author);
              return;
            }

            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            const approvedByOwner = reviews.some(review =>
              review.state === 'APPROVED' &&
              orgOwners.includes(review.user.login)
            );

            if (!approvedByOwner) {
              core.setFailed('❌ PR must be approved by an org owner: ' + orgOwners.join(', '));
            } else {
              console.log('✅ PR approved by authorized owner');
            }

  block-author-merge:
    name: Block Self-Merge (except owners)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Prevent self-merge except for org owners
        uses: actions/github-script@v7
        with:
          script: |
            const author = context.payload.pull_request.user.login;
            const orgOwners = ['dalestubblefield', 'gapietro', 'michaelbuckner'];

            // Allow org owners to self-merge
            if (orgOwners.includes(author)) {
              console.log('✅ Org owner can self-merge: ' + author);
              return;
            }

            // For everyone else, block self-approval
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            const selfApproved = reviews.some(review =>
              review.state === 'APPROVED' &&
              review.user.login === author
            );

            if (selfApproved) {
              core.setFailed('❌ Non-owner PR authors cannot approve their own PRs. Requires approval from: ' + orgOwners.join(', '));
            } else {
              console.log('✅ No self-approval detected');
            }
