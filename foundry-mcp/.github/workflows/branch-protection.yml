name: Branch Protection

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  enforce-pr-workflow:
    name: Enforce PR Workflow
    runs-on: ubuntu-latest
    steps:
      - name: Check if push is from merged PR
        if: github.event_name == 'push'
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
        run: |
          # Check if this is a merge commit from a PR or from allowed bots
          if [[ ! "$COMMIT_MSG" =~ ^Merge\ pull\ request\ #[0-9]+ ]] && \
             [[ "$ACTOR" != "dependabot[bot]" ]] && \
             [[ "$ACTOR" != "github-actions[bot]" ]]; then
            echo "❌ Direct pushes to main are not allowed!"
            echo "Please create a pull request instead."
            echo "Actor: $ACTOR"
            exit 1
          fi

      - uses: actions/checkout@v4
        if: github.event_name == 'push'
        with:
          fetch-depth: 0

      - name: Verify linear history
        if: github.event_name == 'push'
        run: |
          # Check for merge commits (non-linear history)
          # Allow the first merge commit (the PR merge itself)
          MERGE_COUNT=$(git log --oneline --merges HEAD~5..HEAD | wc -l)
          if [ "$MERGE_COUNT" -gt 1 ]; then
            echo "❌ Multiple merge commits detected! Use rebase or squash merge."
            git log --oneline --merges HEAD~5..HEAD
            exit 1
          fi

  require-approval:
    name: Require PR Approval
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check for approvals
        uses: actions/github-script@v7
        with:
          script: |
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            // Org owners who can approve
            const approvers = ['dalestubblefield', 'gapietro', 'michaelbuckner'];

            const approvedByOwner = reviews.some(review =>
              review.state === 'APPROVED' &&
              approvers.includes(review.user.login)
            );

            if (!approvedByOwner) {
              core.setFailed('❌ PR must be approved by an org owner: ' + approvers.join(', '));
            } else {
              console.log('✅ PR approved by authorized owner');
            }

  block-author-merge:
    name: Block Self-Merge (except owners)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Prevent self-merge except for org owners
        uses: actions/github-script@v7
        with:
          script: |
            const author = context.payload.pull_request.user.login;
            const orgOwners = ['dalestubblefield', 'gapietro', 'michaelbuckner'];

            // Allow org owners to self-merge
            if (orgOwners.includes(author)) {
              console.log('✅ Org owner can self-merge: ' + author);
              return;
            }

            // For everyone else, block self-approval
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            const selfApproved = reviews.some(review =>
              review.state === 'APPROVED' &&
              review.user.login === author
            );

            if (selfApproved) {
              core.setFailed('❌ Non-owner PR authors cannot approve their own PRs. Requires approval from: ' + orgOwners.join(', '));
            } else {
              console.log('✅ No self-approval detected');
            }
