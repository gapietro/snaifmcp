name: Block Direct Push

on:
  push:
    branches: [ main ]

jobs:
  check:
    name: Prevent Direct Push to Main
    runs-on: ubuntu-latest
    steps:
      - name: Block direct push to main
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          IS_FORCED: ${{ github.event.forced }}
        run: |
          echo "Checking push to main branch..."
          echo "Event: $EVENT_NAME"
          echo "Ref: $REF_NAME"
          echo "Actor: $ACTOR"

          # Allow bots
          if [[ "$ACTOR" == "github-actions[bot]" ]] || \
             [[ "$ACTOR" == "dependabot[bot]" ]]; then
            echo "✅ Automated bot push allowed"
            exit 0
          fi

          # Check if this is a force push
          if [[ "$IS_FORCED" == "true" ]]; then
            echo "❌ Force push detected!"
            exit 1
          fi

          # Check if this came from a PR merge
          if [[ "$COMMIT_MSG" =~ ^Merge\ pull\ request\ #[0-9]+ ]] || \
             [[ "$COMMIT_MSG" =~ ^Bump\ version\ to ]]; then
            echo "✅ Push from merged PR or version bump allowed"
            exit 0
          fi

          # If we get here, this is likely a direct push
          echo "❌ Direct pushes to main are not allowed!"
          echo "Please create a pull request instead."
          exit 1
